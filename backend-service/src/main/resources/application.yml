server:
  port: 8090

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  zmq:
    endpoint: ${APP_ZMQ_ENDPOINT:tcp://127.0.0.1:5555}
    receive-timeout-ms: ${APP_ZMQ_RECEIVE_TIMEOUT_MS:1000}

  spectrum:
    default-nfft: ${APP_SPECTRUM_NFFT:2048}
    half-spectrum: ${APP_SPECTRUM_HALF:true}
    apply-hann-window: ${APP_SPECTRUM_HANN:true}

  detection:
    iq-enabled: ${APP_DETECTION_IQ_ENABLED:true}
    detection-threshold: ${APP_DETECTION_THRESHOLD:0.22}
    detection-cooldown-ms: ${APP_DETECTION_COOLDOWN_MS:5000}
    iq-dump-enabled: ${APP_DETECTION_IQ_DUMP_ENABLED:true}
    iq-dump-dir: ${APP_DETECTION_IQ_DUMP_DIR:./data/iq-dumps}
    iq-dump-max-bytes: ${APP_DETECTION_IQ_DUMP_MAX_BYTES:131072}
    iq-dump-max-files: ${APP_DETECTION_IQ_DUMP_MAX_FILES:2000}
    bands:
      - ${APP_DETECTION_BAND_1:433000000-435000000}
      - ${APP_DETECTION_BAND_2:863000000-928000000}
      - ${APP_DETECTION_BAND_3:2400000000-2483500000}
      - ${APP_DETECTION_BAND_4:5725000000-5875000000}
    ml:
      enabled: ${APP_DETECTION_ML_ENABLED:true}
      blend: ${APP_DETECTION_ML_BLEND:0.45}
      override-threshold: ${APP_DETECTION_ML_OVERRIDE_THRESHOLD:0.78}
      known-channel-tolerance-hz: ${APP_DETECTION_ML_CHANNEL_TOLERANCE_HZ:12000000}
      model-path: ${APP_DETECTION_ML_MODEL_PATH:}

  registry:
    offline-after-ms: ${APP_REGISTRY_OFFLINE_AFTER_MS:45000}

  security:
    auth-enabled: ${APP_SECURITY_AUTH_ENABLED:false}
    issuer-uri: ${KEYCLOAK_ISSUER_URI:}
